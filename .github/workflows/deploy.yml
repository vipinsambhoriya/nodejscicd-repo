
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # 1. Build and test the application
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Start Application and Run Tests
        run: |
          npm start > app.log 2>&1 &
          APP_PID=$!

          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          READY=0

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application failed to start"
            cat app.log
            exit 1
          fi

          npm test

  # 2. Deploy application to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::018088156408:role/GitHubActions-Staging-Deploy
          aws-region: us-east-2

      # Verify AWS connection

      - name: Deploy to EC2 using SSM
        env:
          INSTANCE_ID: ${{ vars.STAGING_EC2_INSTANCE_ID }}
        run: |
          set -e

          if [ -z "$INSTANCE_ID" ]; then
            echo "EC2 instance ID is missing"
            exit 1
          fi

          echo "Sending deployment command to EC2..."

          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "cd /home/ubuntu/nodejs-cicd/nodejscicd-repo",
              "sudo -u ubuntu -H git -C /home/ubuntu/nodejs-cicd/nodejscicd-repo pull --ff-only origin main",
              "sudo -u ubuntu -H bash -c 'cd /home/ubuntu/nodejs-cicd/nodejscicd-repo && npm ci'",
              "sudo -u ubuntu -H bash -c 'cd /home/ubuntu/nodejs-cicd/nodejscicd-repo && if pm2 describe nodejs-app >/dev/null 2>&1; then pm2 restart nodejs-app; else pm2 start npm --name nodejs-app -- start; fi && pm2 save'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac

            sleep 5
          done

          echo "Deployment output:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo "Deployment errors:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed. Status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully!"
