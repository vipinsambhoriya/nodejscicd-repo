name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # JOB 1: BUILD
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build


  # JOB 2: TEST
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Start Application and Run Tests
        run: |
          npm start > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              break
            fi
            sleep 2
          done
          npm test
  # JOB 3: RUN
  run:
    name: Run Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Application Smoke Test
        run: |
          npm start > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              break
            fi
            sleep 2
          done
          curl -f http://127.0.0.1:3000/
          echo "Application is running successfully!"
  # JOB 4: DEPLOY
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::018088156408:role/GitHubActions-Staging-Deploy
          aws-region: us-east-2

      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity
          script: |
            cd /home/ubuntu/nodejs-cicd/nodejscicd-repo
            echo "Pulling latest code..."
            git pull --ff-only origin main
            echo "Installing dependencies..."
            npm ci
            echo "Restarting application..."
            sudo pm2 restart nodejs-app
            sudo pm2 save
            echo "Deployment completed successfully!"
