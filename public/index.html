
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js CI/CD Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            padding: 55px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            color: #d1d5db;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .status span {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 13px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 26px;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🚀</div>

        <h1>Welcome to Node.js Application</h1>

        <p>
            Your application is successfully deployed and running
            on an AWS EC2 instance.
        </p>

        <div class="status">
            <span></span>
            Application is Running
        </div>

        <br>

        <a href="/health" class="button">Check Application Health</a>

        <footer>
            Powered by Node.js, Express & PM2
            <br><br>
            CI/CD Deployment Project
        </footer>
    </div>
</body>
</html>
